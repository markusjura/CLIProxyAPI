name: Build patched CLIProxyAPI
on:
  pull_request:
    paths:
      - ".fork/**"
      - ".github/workflows/fork-update.yml"
  schedule:
    - cron: '19 6 * * *'
  workflow_dispatch:
    inputs:
      upstream:
        description: 'Exact upstream tag, or latest'
        default: latest
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: fork-update-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'markusjura/CLIProxyAPI' && github.event_name != 'pull_request'
    runs-on: macos-15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test, build, and publish patched release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ inputs.upstream || 'latest' }}
        run: python3 .fork/update.py --upstream "$UPSTREAM" --output "$RUNNER_TEMP/patched-release" --publish
      - name: Track release build failure
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Patched release build is failing'
          issue=$(gh issue list --state open --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ "$OUTCOME" = success ]; then
            [ -z "$issue" ] || gh issue close "$issue" --comment "Fixed by $RUN_URL"
          elif [ -z "$issue" ]; then
            gh issue create --title "$title" --body "The release build failed in $RUN_URL. The gateway keeps its installed release until the patch queue builds again."
          fi
  test:
    if: github.repository == 'markusjura/CLIProxyAPI' && github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate patch queue and build
        run: python3 .fork/update.py --output "$RUNNER_TEMP/patched-test"
